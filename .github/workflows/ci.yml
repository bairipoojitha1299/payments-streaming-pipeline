# On every push: unit tests, an end-to-end Kafka test against a real broker,
# dbt project validation (Snowflake adapter) and a DAG syntax check.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      kafka:
        image: apache/kafka:3.8.0
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 5s --health-retries 20

    env:
      KAFKA_BOOTSTRAP: localhost:9092
      KAFKA_INTEGRATION: "1"
      SNOWFLAKE_ACCOUNT: ci-placeholder     # dbt parse never connects

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit + Kafka integration tests
        run: pytest -v

      - name: Validate dbt project (Snowflake adapter)
        working-directory: dbt/payments
        run: dbt parse --profiles-dir .

      - name: Check DAG and scripts compile
        run: python -m py_compile dags/*.py scripts/*.py streaming/*.py
