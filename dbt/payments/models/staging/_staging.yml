version: 2

models:
  - name: stg_card_transactions
    description: "Typed, deduplicated card transactions (incremental merge on event_id)."
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: card_id
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]
      - name: category
        data_tests:
          - accepted_values:
              values: [entertainment, food_dining, gas_transport, grocery_net, grocery_pos,
                       health_fitness, home, kids_pets, misc_net, misc_pos, personal_care,
                       shopping_net, shopping_pos, travel]
  - name: stg_dead_letters
    description: "One row per validation error on a rejected message."
